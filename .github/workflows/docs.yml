name: Documentation checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate-readme.mjs --check
      - run: node scripts/generate-guide-index.mjs --check
      - run: node scripts/sync-ui-labels.mjs --check
